---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: technitium-local
  namespace: beszel
spec:
  entryPoints: [web]
  routes:
    - match: Host(`technitium.${DOMAIN_LOCAL}`)
      kind: Rule
      services:
        - name: technitium
          port: 5380
