---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/cilium/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Deliberately false. If this path ever goes missing from git, pruning would
  # delete the CNI and take the cluster with it. Cilium gets its own
  # Kustomization precisely so it can opt out of the pruning everything else uses.
  prune: false
  wait: true
  timeout: 10m
