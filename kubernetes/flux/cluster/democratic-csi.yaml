---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: democratic-csi
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/infrastructure/democratic-csi/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
  prune: true
  wait: true
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
